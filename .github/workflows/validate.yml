name: Validate OPC IQ demo

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: anthony-c-martin/setup-bicep@v1
      - run: npm ci
      - run: npm run check
      - run: bicep build infra/main.bicep --stdout >/dev/null
      - run: bash -n scripts/*.sh worker/bootstrap.sh